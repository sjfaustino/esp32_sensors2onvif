# Runs the unit tests and the end-to-end test of the PC build, builds the firmware for every board, and fuzzes the
# parsers, on each push.
# Windows, because the PC build links Winsock (-lws2_32 in platformio.ini).
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tools/version.py names the firmware with git describe

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and ffmpeg
        run: |
          pip install platformio cryptography
          choco install ffmpeg --no-progress -y

      - name: Web page scripts
        run: |
          Get-ChildItem web/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
          npx --yes prettier@3.3.3 --print-width 120 --end-of-line lf --check web/*.js web/*.css

      - name: C++ style
        run: |
          pip install clang-format==19.1.7
          clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h' | Where-Object { $_ -notmatch '_data.cpp$' })

      - name: Every setting is loaded and saved
        run: python tools/check_settings.py

      - name: Every colour of the pages is named, light and dark
        run: python tools/check_colours.py

      - name: Unit tests
        run: pio test -e native

      - name: End-to-end test of the PC build
        run: |
          pio run -e host
          python tools/e2e_test.py

      # In a real browser: arming, disarming and the test alerts, on the pages, the hub and a pretend NVR.
      - name: The web pages in a browser
        run: |
          pip install playwright==1.52.0
          python -m playwright install chromium
          python tools/e2e_pages.py

      # The user guide's pictures can still be taken; they are kept here to compare with the ones in docs/images.
      - name: Pictures of the pages
        run: python tools/screenshots.py

      - name: Keep the pictures
        uses: actions/upload-artifact@v4
        with:
          name: page-pictures
          path: docs/images/*.png

      - name: Firmware for every board
        run: pio run -e esp32_16mb -e esp32dev -e esp32s3

      - name: Keep the 16 MB firmware and its .elf
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32_16mb
          path: |
            .pio/build/esp32_16mb/firmware.bin
            .pio/build/esp32_16mb/firmware.elf
          retention-days: 30

  # Every parser of what reaches the hub from outside, under libFuzzer with AddressSanitizer and UndefinedBehavior
  # Sanitizer, for two minutes: on Linux, where clang has them. The inputs it built up are kept for the next run.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .pio/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz the parsers
        run: FUZZ_SECONDS=120 sh tools/fuzz.sh

      - name: Keep what made it fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure
          path: .pio/fuzz/crash-*
