# Runs the unit tests and the end-to-end test of the PC build, and builds the firmware for every board, on each push.
# Windows, because the PC build links Winsock (-lws2_32 in platformio.ini).
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tools/version.py names the firmware with git describe

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and ffmpeg
        run: |
          pip install platformio
          choco install ffmpeg --no-progress -y

      - name: Unit tests
        run: pio test -e native

      - name: End-to-end test of the PC build
        run: |
          pio run -e host
          python tools/e2e_test.py

      - name: Firmware for every board
        run: pio run -e esp32_16mb -e esp32dev -e esp32s3

      - name: Keep the 16 MB firmware and its .elf
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32_16mb
          path: |
            .pio/build/esp32_16mb/firmware.bin
            .pio/build/esp32_16mb/firmware.elf
          retention-days: 30
