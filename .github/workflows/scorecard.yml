# OpenSSF Scorecard rates how the repository is kept: branch protection, pinned actions, signed releases, security
# policy and the rest. It runs on main, weekly, and when branch protection changes; the results show under the Security
# tab and in the README's badge.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write  # publishes the results, for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: results.sarif
