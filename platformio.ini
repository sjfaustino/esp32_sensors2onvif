[platformio]
default_envs = esp32dev

[esp32_common]
platform = espressif32@6.8.0
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<host_main.cpp>
build_flags = -std=gnu++17 -Iinclude
build_unflags = -std=gnu++11

[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1

; Runs the same firmware library on this PC, bound to loopback, for tools/e2e_test.py.
; -lws2_32 is for Windows; remove it to build on Linux or macOS.
[env:host]
platform = native
build_src_filter = -<*> +<host_main.cpp>
build_flags = -std=gnu++17 -Iinclude -lws2_32

; Unit tests: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Iinclude -lws2_32
