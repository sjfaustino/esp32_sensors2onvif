[platformio]
default_envs = esp32_16mb

[esp32_common]
; pioarduino fork of platform-espressif32, pinned so an upstream release can't change what gets built.
; Release 55.03.311 is Arduino core 3.3.11 and ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = +<*> -<host_main.cpp>
build_flags = -Iinclude
; Names the firmware after the git commit it is built from, and builds the pages in web/ into it.
extra_scripts = pre:tools/version.py, pre:tools/embed_web.py

[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32_16mb]
extends = esp32_common
board = esp32dev
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions_16mb.csv
; The default speed stopped partway through on a board with a CH9102 USB chip.
upload_speed = 115200

[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1

; Runs the same firmware library on this PC, bound to loopback, for tools/e2e_test.py.
; -lws2_32 is for Windows; remove it to build on Linux or macOS.
[env:host]
platform = native
build_src_filter = -<*> +<host_main.cpp>
build_flags = -std=gnu++17 -Iinclude -lws2_32 -DCAM_TEST_HOOKS
extra_scripts = pre:tools/embed_web.py

; Unit tests: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Iinclude -lws2_32 -DCAM_TEST_HOOKS
extra_scripts = pre:tools/embed_web.py
