[platformio]
default_envs = feather_s2

[esp32_common]
; pioarduino fork of platform-espressif32, pinned so an upstream release can't change what gets built.
; Release 55.03.311 is Arduino core 3.3.11 and ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = +<*> -<host_main.cpp>
build_flags = -Iinclude

[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1

[env:feather_s2]
extends = esp32_common
board = adafruit_feather_esp32s2
board_build.partitions = partitions_feather_s2.csv

; Runs the same firmware library on this PC, bound to loopback, for tools/e2e_test.py.
; -lws2_32 is for Windows; remove it to build on Linux or macOS.
[env:host]
platform = native
build_src_filter = -<*> +<host_main.cpp>
build_flags = -std=gnu++17 -Iinclude -lws2_32

; Unit tests: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Iinclude -lws2_32
